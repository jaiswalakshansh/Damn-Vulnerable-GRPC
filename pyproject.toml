[project]
name = "dvgrpc"
version = "1.1.0"
description = "Damn Vulnerable gRPC — intentionally insecure gRPC server for security training and CTF practice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jaiswalakshansh" }]
keywords = ["grpc", "security", "ctf", "training", "vulnerable", "dvgrpc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Education :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "grpcio>=1.62,<2.0",
    "grpcio-tools>=1.62,<2.0",
    "grpcio-reflection>=1.62,<2.0",
    "PyJWT>=2.8,<3.0",
    "cryptography>=42.0,<44.0",
    "bcrypt>=4.1,<5.0",
    "pycryptodome>=3.20,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "black>=24.0",
    "pytest-xdist>=3.6",
]

[project.scripts]
dvgrpc-server     = "server.main:serve"
dvgrpc-scoreboard = "scripts.scoreboard:main"

[project.urls]
Homepage      = "https://github.com/jaiswalakshansh/Damn-Vulnerable-GRPC"
Documentation = "https://github.com/jaiswalakshansh/Damn-Vulnerable-GRPC/tree/main/docs"
Issues        = "https://github.com/jaiswalakshansh/Damn-Vulnerable-GRPC/issues"

[tool.setuptools]
packages = ["server", "server.interceptors", "server.services", "client", "client.exploits", "scripts"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["generated", ".venv", ".dvgrpc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Exploit scripts intentionally use insecure patterns for teaching — ignore a few noisy rules.
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"client/exploits/*" = ["S", "E", "F841"]  # demo code: unused vars are fine
"challenges/**/*"    = ["ALL"]

[tool.black]
line-length = 110
target-version = ["py310", "py311", "py312"]
extend-exclude = "generated|\\.venv|\\.dvgrpc"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
timeout = 30
markers = [
    "integration: tests that require a running DVGRPC server",
    "slow: marks tests as slow",
]
