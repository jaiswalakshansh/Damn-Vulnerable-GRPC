name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.1.0)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/dvgrpc:latest
            ghcr.io/${{ github.repository_owner }}/dvgrpc:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  gh-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        id: changelog
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, pathlib
          tag = os.environ.get("GITHUB_REF_NAME") or ""
          version = tag.lstrip("v") or "unreleased"
          body = pathlib.Path("CHANGELOG.md").read_text()
          # Grab the block for this version
          m = re.search(rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", body, re.M | re.S)
          section = (m.group(0) if m else "See CHANGELOG.md").strip()
          print("body<<EOF_CHANGELOG")
          print(section)
          print("EOF_CHANGELOG")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
