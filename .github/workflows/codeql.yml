name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # This project is intentionally vulnerable — suppress the obvious
          # insecure patterns so alerts focus on NEW regressions only.
          config: |
            name: "DVGRPC CodeQL"
            queries:
              - uses: security-and-quality
            paths-ignore:
              - "challenges/**"
              - "client/exploits/**"
              - "generated/**"
      - uses: github/codeql-action/analyze@v4
